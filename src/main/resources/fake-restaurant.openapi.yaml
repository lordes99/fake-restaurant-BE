openapi: 3.0.3
info:
  title: Server
  version: '1'
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Public
    description: Backend functions for public endpoints
  - name: User
    description: Backend functions for user endpoints
  - name: Restaurant
    description: Backend functions for restaurant endpoints
  - name: Review
    description: Backend functions for review endpoints
  - name: Geo
    description: Backend functions for geo endpoints
paths:
  /public/login:
    post:
      tags:
        - Public
      operationId: LoginPost
      summary: Login user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /public/register:
    post:
      tags:
        - Public
      operationId: RegisterPost
      summary: Register user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /users:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UsersPost
      summary: Bootstrap user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: the user uuid
          content:
            application/json:
              schema:
                type: string
                format: uuid
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'
    get:
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SearchQueryParam'
      operationId: UsersGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                title: UsersPage
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  page:
                    $ref: "#/components/schemas/Page"
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UserIdGet
      summary: Get User Data
      responses:
        200:
          description: the user uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'
    put:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UserIdPut
      summary: Modify User Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: the user uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        404:
          $ref: '#/components/responses/Not_Found_404'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /users/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - Review
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
      operationId: UserIdReviewsGet
      summary: Get User reviews
      responses:
        200:
          description: the user reviews
          content:
            application/json:
              schema:
                title: ReviewsPage
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  page:
                    $ref: "#/components/schemas/Page"
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /restaurants:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantsPost
      summary: Create new restaurant
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                restaurant:
                  $ref: '#/components/schemas/Restaurant'
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        201:
          description: the restaurant uuid
          content:
            application/json:
              schema:
                type: string
                format: uuid
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /public/restaurants:
    get:
      tags:
        - Restaurant
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SearchQueryParam'
      operationId: RestaurantsGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                title: RestaurantsPage
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/Restaurant"
                  page:
                    $ref: "#/components/schemas/Page"
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /public/restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantIdGet
      summary: Get Restaurant Data
      responses:
        200:
          description: the Restaurant uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    put:
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantIdPut
      summary: Modify Restaurant Data
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                restaurant:
                  $ref: '#/components/schemas/Restaurant'
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        200:
          description: the restaurant uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UUIDReference'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        404:
          $ref: '#/components/responses/Not_Found_404'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

    delete:
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantIdDelete
      summary: Delete Restaurant Data
      responses:
        204:
          description: restaurant deleted
        401:
          $ref: '#/components/responses/Unauthorized_401'
        404:
          $ref: '#/components/responses/Not_Found_404'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /restaurants/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Review
      operationId: ReviewsPost
      summary: Create new review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        201:
          description: the review uuid
          content:
            application/json:
              schema:
                type: string
                format: uuid
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /reverse-geocode:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Geo
      operationId: reverseGeocodeSearch
      summary: return point name from lat and lon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coordinate'
      responses:
        200:
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominatimForwardSearchResponse'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /forward-geocode:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Geo
      operationId: forwardGeocodeSearch
      summary: return geopoint name from address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominatimForwardSearchRequest'
      responses:
        200:
          description: Results of search coordinate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NominatimForwardSearchResponse'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

  /img/validate:
    get:
      tags:
        - Image
      summary: Validate an image URL.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: url
      responses:
        200:
          description: Validated
          content:
            application/json:
              schema:
                title: ImageValidationResponse
                type: object
                properties:
                  isImage:
                    type: boolean
                  contentType:
                    type: string
        401:
          $ref: '#/components/responses/Unauthorized_401'
        404:
          $ref: '#/components/responses/Not_Found_404'
        500:
          $ref: '#/components/responses/Internal_Server_Error_500'

