openapi: 3.0.3
info:
  title: Server
  version: '1'
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Public
    description: Backend functions for public endpoints
  - name: User
    description: Backend functions for user endpoints
  - name: Restaurant
    description: Backend functions for restaurant endpoints
  - name: Geo
    description: Backend functions for geo endpoints
paths:
  /public/login:
    post:
      tags:
        - Public
      operationId: LoginPost
      summary: Login user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /public/register:
    post:
      tags:
        - Public
      operationId: RegisterPost
      summary: Register user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UsersPost
      summary: Bootstrap user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: the user uuid
          content:
            application/json:
              schema:
                type: string
                format: uuid
        401:
          $ref: '#/components/responses/Unauthorized_401'
    get:
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SearchQueryParam'
      operationId: UsersGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                title: UsersPage
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  page:
                    $ref: "#/components/schemas/Page"
        401:
          $ref: '#/components/responses/Unauthorized_401'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDParamPath'
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UserIdGet
      summary: Get User Data
      responses:
        200:
          description: the user uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized_401'
    put:
      security:
        - bearerAuth: [ ]
      tags:
        - User
      operationId: UserIdPut
      summary: Modify User Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: the user uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized_401'
        404:
          $ref: '#/components/responses/Not_Found_404'

  /restaurants:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantsPost
      summary: Create new restaurant
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                restaurant:
                  $ref: '#/components/schemas/Restaurant'
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        201:
          description: the restaurant uuid
          content:
            application/json:
              schema:
                type: string
                format: uuid
        401:
          $ref: '#/components/responses/Unauthorized_401'

  /public/restaurants:
    get:
      tags:
        - Restaurant
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SearchQueryParam'
      operationId: RestaurantsGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                title: RestaurantsPage
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/Restaurant"
                  page:
                    $ref: "#/components/schemas/Page"

  /reverse-geocode:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - Geo
      operationId: reverseGeocodeSearch
      summary: return point name from lat and lon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coordinate'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominatimPoint'
        401:
          $ref: '#/components/responses/Unauthorized_401'

  /restaurants/{id}/upload-photo:
    post:
      parameters:
        - $ref: '#/components/parameters/UUIDParamPath'
      security:
        - bearerAuth: [ ]
      tags:
        - Restaurant
      operationId: RestaurantsIdUploadPhotoPost
      summary: Add photos in restaurant
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - file
      responses:
        200:
          description: Photo url
          content:
            application/json:
              schema:
                type: object
                properties:
                  uris:
                    type: array
                    items:
                      type: string
                      format: uri
        401:
          $ref: '#/components/responses/Unauthorized_401'


