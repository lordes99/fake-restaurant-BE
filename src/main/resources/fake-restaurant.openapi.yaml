components:
  responses:
    Unauthorized_401:
      description: Unauthorized_401
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Not_Found_404:
      description: Not_Found_404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    PageQueryParam:
      in: query
      required: false
      name: page
      schema:
        type: integer
        format: int32
      description: |
        Page numbers starting at 0.
    SizeQueryParam:
      in: query
      required: false
      name: size
      schema:
        type: integer
        format: int32
      description: |
        Size 0 equals to default size. Maximum size may be limited anytime and not honored by the backend.

    SearchQueryParam:
      in: query
      required: false
      name: search
      schema:
        type: string
      description: |
        Search keyword to search in element.

    UUIDParamPath:
      in: path
      required: true
      name: id
      schema:
        type: string
        format: uuid



  schemas:
    Page:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64

    User:
      type: object
      required:
        - id
        - name
        - surname
        - email
        - role
      properties:
        id:
          $ref: "#/components/schemas/UUIDReference"
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Restaurant:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUIDReference"
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        address:
          $ref: '#/components/schemas/Address'
        characteristics:
          items:
            $ref: '#/components/schemas/RestaurantCharacteristic'
        photos:
          items:
            type: string
        workingHours:
          items:
            $ref: "#/components/schemas/WorkingDay"
        ownerUser:
          $ref: "#/components/schemas/User"
        reviews:
          items:
            $ref: "#/components/schemas/Review"
    #        defaultLanguage:
#          type: string
#        disabledAt:
#          $ref: '#/components/schemas/InstantDateTimeRO'

    WorkingDay:
      type: object
      properties:
        day:
          $ref: '#/components/schemas/DayType'
        closed:
          type: boolean
        hours:
          items:
            $ref: '#/components/schemas/WorkingHour'

    WorkingHour:
      type: object
      properties:
        open:
          type: string
          format: date-time
        close:
          type: string
          format: date-time

    DayType:
      type: string
      enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday

    RestaurantCharacteristic:
      type: string
      enum:
        - FAST_FOOD
        - PIZZERIA
        - PUB
        - RESTAURANT
        - BISTROT
        - FARMHOUSE
        - STREET_FOOD
        - VEGETARIAN
        - VEGAN
        - GLUTEN_FREE
        - FISH
        - MEAT
        - INDIAN
        - SUSHI
        - JAPANESE
        - SPANISH
        - MEXICAN
        - GREEK
        - KEBAB
        - ITALIAN

    Address:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
        street:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Review:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUIDReference"
        title:
          type: string
        description:
          type: string
        vote:
          $ref: "#/components/schemas/VoteType"
        createdAt:
          type: string
          format: date-time
        photos:
          items:
            type: string
        restaurantId:
          $ref: "#/components/schemas/UUIDReference"
        ownerUserId:
          $ref: "#/components/schemas/UUIDReference"

    VoteType:
      type: string
      enum:
        - UP
        - DOWN

    Role:
      type: string
      enum:
        - ADMIN
        - USER

    InstantDateTime:
      type: object
      example: "2025-01-01T12:00:00.000Z"
      properties:
        foo:
          type: object

    InstantDateTimeRO:
      type: object
      readOnly: true
      example: "2025-01-01T12:00:00.000Z"
      properties:
        foo:
          type: object

    UUIDReference:
      type: string
      format: uuid
      readOnly: true

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        token:
          type: string

    Error:
      type: object
      properties:
        message:
          type: string

    Coordinate:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    NominatimPoint:
      type: object
      properties:
        displayName:
          type: string
        address:
          $ref: '#/components/schemas/Address'

